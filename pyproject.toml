[project]
name = "amr-evidence-extraction"
version = "0.1.0"
description = "Extract AST data and genomic metadata from scientific literature"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pydantic>=2.0.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
browser = [
    "playwright>=1.40",
]
ollama = [
    "ollama>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: marks tests as requiring live LLM calls (deselect with '-m \"not llm\"')",
]
